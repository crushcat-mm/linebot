name: Keep Render Alive

on:
  schedule:
    # 每 10 分鐘發送一次請求，防止 Render 休眠
    - cron: '*/10 * * * *'
  workflow_dispatch: # 允許在 GitHub 手動點擊測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping to Render
        run: |
          curl -s https://linebot-co24.onrender.com > /dev/null
